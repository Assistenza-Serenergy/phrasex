[package]
name = "phrasex-listener"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
phrasex-engine = { path = "../engine" }
phrasex-store = { path = "../store" }

[target.'cfg(windows)'.dependencies]
# COM interfaces (accessibility caret); same version Tauri already builds
windows = { version = "0.62", features = ["Win32_System_Com", "Win32_System_Ole", "Win32_System_Variant", "Win32_UI_Accessibility"] }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
